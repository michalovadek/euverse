project:
  type: website
  output-dir: _site
  render:
    - home.qmd
    - "trackers/*.qmd"
    # eu-politics taken offline: kept in the repo but not published
    - "!trackers/eu-politics.qmd"
    - "!old/**"
  resources:
    - "assets/**"

website:
  title: "euverse"
  site-url: "https://michalovadek.github.io/euverse"
  favicon: assets/favicon.svg
  open-graph:
    image: assets/og-image.svg
    image-width: 1200
    image-height: 630
  # Lets readers flag mistakes in the data interpretation or the qmd
  # directly via GitHub. "issue" links open a new issue prefilled with
  # the page URL so triaging is easy.
  repo-url: https://github.com/michalovadek/euverse
  repo-actions: [issue, source]
  back-to-top-navigation: true
  page-navigation: true
  # Top navbar: site title links to home (top-left), top-level tabs to
  # each tracker page (left), search and repo-actions (right). The
  # docked sidebar below mirrors this navigation in book-chapter style,
  # but the navbar tabs give a quick top-of-page shortcut so the
  # ribbon doesn't read as empty.
  navbar:
    search: true
    left:
      - href: home.qmd
        text: Home
      - href: trackers/eu-finance.qmd
        text: Finance
      - href: trackers/eu-vetoes.qmd
        text: Vetoes
      - href: trackers/eu-court.qmd
        text: Court
      - href: trackers/eu-law.qmd
        text: Law
      - href: trackers/eu-enlargement.qmd
        text: Enlargement
  sidebar:
    style: docked
    align: left
    search: false   # search lives in the navbar, not here
    contents:
      - text: Home
        href: home.qmd
      - section: Trackers
        contents:
          - text: EU Finance
            href: trackers/eu-finance.qmd
          - text: EU Vetoes
            href: trackers/eu-vetoes.qmd
          - text: EU Court
            href: trackers/eu-court.qmd
          - text: EU Law
            href: trackers/eu-law.qmd
          - text: EU Enlargement
            href: trackers/eu-enlargement.qmd

format:
  html:
    theme:
      light: [zephyr, assets/style.scss]
      dark:  [darkly, assets/style.scss]
    include-in-header: assets/header.html
    toc: false
    smooth-scroll: true
    # Tweak the page grid so the content column is wider and the
    # docked sidebar narrower, which visually centres the article
    # body between the sidebar (left) and the TOC margin (right).
    grid:
      sidebar-width: 220px
      body-width: 900px
      margin-width: 240px

execute:
  freeze: auto
  # Suppress R warnings and messages from being baked into the rendered
  # HTML. Warnings still appear in stderr (visible in CI logs) so we
  # don't lose the signal; we just don't dump them onto the page where
  # readers can see them. Errors still surface (failed chunk = visible
  # error block, by Quarto default).
  warning: false
  message: false
