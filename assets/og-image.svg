<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="euverse — public-data dashboards on European Union institutions">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0072B2"/>
      <stop offset="100%" stop-color="#005c8f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 12 EU stars stylised, top-right -->
  <g fill="#FFD700" opacity="0.18">
    <circle cx="980"  cy="120" r="14"/>
    <circle cx="1060" cy="140" r="14"/>
    <circle cx="1110" cy="200" r="14"/>
    <circle cx="1120" cy="280" r="14"/>
    <circle cx="1100" cy="360" r="14"/>
    <circle cx="1050" cy="420" r="14"/>
    <circle cx="980"  cy="450" r="14"/>
    <circle cx="910"  cy="430" r="14"/>
    <circle cx="860"  cy="380" r="14"/>
    <circle cx="850"  cy="300" r="14"/>
    <circle cx="870"  cy="220" r="14"/>
    <circle cx="920"  cy="150" r="14"/>
  </g>

  <text x="80" y="260"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="140" font-weight="700" fill="#fff">euverse</text>

  <text x="80" y="340"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="36" font-weight="400" fill="#cce5f5">Public-data dashboards on European Union institutions,</text>
  <text x="80" y="390"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="36" font-weight="400" fill="#cce5f5">refreshed every night.</text>

  <text x="80" y="540"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="22" font-weight="400" fill="#8dbedc">finance · vetoes · court · law · enlargement</text>
  <text x="80" y="575"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="22" font-weight="400" fill="#8dbedc">michalovadek.github.io/euverse</text>
</svg>
