name: Render and deploy

# Triggers:
#   - schedule: nightly at 03:17 UTC. Chosen to land AFTER Eurostat's typical
#     daily refresh window (~02:00 UTC for most indicators) and well before the
#     working day in Europe. NOT 23:59 UTC like the old standalone trackers
#     used — that races with Eurostat updates and gives stale numbers.
#   - push: re-render on layout / code / lockfile changes (docs-only paths
#     skipped to save runner minutes).
#   - workflow_dispatch: manual reruns from the Actions tab.
"on":  # quoted so YAML 1.1 parsers (PyYAML default) read it as a string, not bool True
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel an in-flight nightly render if a push lands; let it finish so the
# uploaded artifact reflects a complete state.
concurrency:
  group: pages-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # All third-party actions use floating major-version tags
      # (@v2/@v4/@v5) so patches + security fixes auto-apply with no
      # manual bumping. Rare failure mode: when a maintainer publishes
      # a fresh tagged release, codeload.github.com can briefly return
      # 500 to runners for that SHA while it propagates through
      # GitHub's action-cache nodes (happened 2026-05-26 with
      # r-lib/actions v2.12.0 + quarto-actions v2.2.0; resolved on its
      # own in a few hours). If you need an immediate workaround
      # before it resolves, temporarily pin the offending action to
      # the PRIOR tag in the same major line (e.g. setup-r@v2.11.4),
      # then revert the pin once the cache catches up. Tag lists:
      #   https://github.com/r-lib/actions/tags
      #   https://github.com/quarto-dev/quarto-actions/tags
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true

      # System libs for compiled R packages. Each entry is the apt pkg required
      # by an R dep listed in renv.lock (verified against rstudio/r-system-requirements).
      # Add to this list whenever a new R package with a sysreq enters the lockfile.
      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libpoppler-cpp-dev \
            libqpdf-dev \
            antiword \
            libgdal-dev \
            libgeos-dev \
            libproj-dev

      # Caches based on hash of renv.lock; runs renv::restore() automatically.
      - name: Restore renv
        uses: r-lib/actions/setup-renv@v2

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.10.7'
          enable-cache: true

      - name: Sync Python environment
        # --frozen requires uv.lock to exist (it does — committed).
        # --no-install-project skips installing this repo as a Python package;
        # we use uv purely as an env manager, not to ship a wheel.
        run: uv sync --frozen --no-install-project

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.7.17'

      # Smoke tests for the shared R helpers. Run before the fetch + render
      # stages so a breaking change in R/celex.R or R/freshness.R fails the
      # workflow IMMEDIATELY (~5 seconds) rather than wasting 5-10 minutes
      # on fetchers/renders only to surface the same bug downstream.
      - name: Run helper smoke tests
        run: Rscript tests/test_helpers.R

      # Graceful degradation: each fetcher under R/fetch_*.R is run in
      # isolation. A failure writes a GH Actions WARNING annotation but does
      # NOT fail the workflow — the qmd pages must fall back to the previous
      # snapshot under data-apis/ and display the "as of <date>" badge from
      # the sidecar .meta.json. See AGENTS.md §4 and R/freshness.R.
      - name: Fetch nightly data
        shell: bash
        run: |
          shopt -s nullglob
          any=false
          for f in R/fetch_*.R; do
            any=true
            name=$(basename "$f")
            echo "::group::$name"
            if Rscript "$f"; then
              echo "$name OK"
            else
              echo "::warning file=$f::Fetcher $name failed; page will fall back to last good snapshot"
            fi
            echo "::endgroup::"
          done
          $any || echo "No R/fetch_*.R scripts yet — skipping fetch stage."

      # Rebuild the cross-cutting derived datasets in data-final/ from the
      # freshly-fetched data-apis/ snapshots + static data-manual/data-external
      # inputs. Order is explicit because build_proposal_acts reads
      # build_proposals_master's output (and alphabetical-glob order would
      # be wrong: proposal_acts < proposals_master). Each script fails the
      # workflow on error (unlike fetchers, which gracefully degrade) —
      # a build failure means the derived parquet would mismatch its
      # inputs and downstream pages would silently render from stale data.
      - name: Rebuild data-final/
        shell: bash
        run: |
          for f in \
              R/build_data_external_parquets.R \
              R/build_eu_member_states.R \
              R/build_proposals_master.R \
              R/build_proposal_acts.R \
              R/build_eu_politics.R \
          ; do
            name=$(basename "$f")
            echo "::group::$name"
            Rscript "$f"
            echo "::endgroup::"
          done

      - name: Render Quarto site
        run: quarto render

      - name: Upload _site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  # ----------------------------------------------------------------------------
  # DEPLOY — active since 2026-05-24.
  # Precondition (one-time owner action, already done): GitHub repo Settings →
  # Pages → Source = "GitHub Actions" (NOT "Deploy from a branch"). Without
  # that toggle, this job fails with "no Pages deployment configured".
  # See docs/specs/2026-05-24-eu-vetoes-port-design.md §3.2.
  # ----------------------------------------------------------------------------
  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ----------------------------------------------------------------------------
  # VERIFY — fetch the live site after deploy and confirm each tracker URL
  # returns 200 and contains an expected content marker. Catches silent
  # post-deploy regressions (Pages CDN cache stuck, redirect loop, page
  # rendered but missing data, etc.) before a reader notices.
  # ----------------------------------------------------------------------------
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages CDN to settle
        run: sleep 30
      # URLs come from Quarto's auto-generated sitemap.xml — that way the
      # verify list never goes stale when pages are added or removed.
      # The previous hardcoded list silently mismatched the deployed site
      # twice (data.html deleted, sidebar refactor) and broke CI both
      # times. Discovery from sitemap fixes that class of failure for good.
      - name: Probe live URLs from sitemap
        shell: bash
        run: |
          set -euo pipefail
          SITEMAP_URL="https://michalovadek.github.io/euverse/sitemap.xml"
          # Pull sitemap with retries in case CDN edge is still warming up.
          for attempt in 1 2 3; do
            if curl -sSL -f -o sitemap.xml "$SITEMAP_URL"; then
              echo "::notice::Fetched sitemap on attempt $attempt"
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Could not fetch sitemap from $SITEMAP_URL"
              exit 1
            fi
            sleep 15
          done
          # Extract <loc>…</loc> values. Each URL must return 200.
          grep -oP '(?<=<loc>)[^<]+' sitemap.xml > urls.txt
          n=$(wc -l < urls.txt)
          if [ "$n" -lt 5 ]; then
            echo "::error::Sitemap returned only $n URLs (expected >=5)"
            cat sitemap.xml
            exit 1
          fi
          echo "::notice::Probing $n URLs from sitemap"
          fail=0
          while read -r url; do
            status=$(curl -sSL -o /dev/null -w "%{http_code}" "$url" || true)
            if [ "$status" = "200" ]; then
              echo "::notice::OK $status $url"
            else
              echo "::error::$url returned $status"
              fail=1
            fi
          done < urls.txt
          exit "$fail"
